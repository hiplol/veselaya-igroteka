<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Arcade // hiplol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --accent: #a3e635;
            --text: #ffffff;
            --muted: #888888;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Экран загрузки */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loader-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 20px;
            letter-spacing: -0.05em;
            animation: pulse 2s infinite;
        }

        .loader-text {
            color: var(--muted);
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--accent);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Холст с игрой */
        canvas.emscripten {
            border: 2px solid var(--accent);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(163, 230, 53, 0.2);
            background-color: #111;
            display: block;
            max-width: 95vw;
            max-height: 95vh;
        }

        /* Скрываем системные элементы Pygbag */
        #infobox, #transfer, #status, #progress, #system, #crt, #pyconsole, #dlg, #box, #info { 
            display: none !important; 
        }
        
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
            transition: opacity 0.2s;
        }
        .back-btn:hover { opacity: 0.7; }
    </style>
</head>
<body>

    <a href="https://hiplol.github.io/" class="back-btn">← Back to Portfolio</a>

    <!-- Экран загрузки -->
    <div id="loading-screen">
        <div class="loader-logo">Fun Arcade</div>
        <div class="loader-text" id="load-status">Initializing Pygame...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="load-progress"></div>
        </div>
    </div>

    <!-- Скрипт Pygbag (Ваш код игры) -->

import sys
import asyncio
import platform
import json
from pathlib import Path

async def custom_site():
    import embed
    platform.document.body.style.background = "#050505"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"

    bundle = "sashs"
    appdir = Path(f"/data/data/{bundle}")
    appdir.mkdir()

    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("sashs.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("sashs.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)

    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    if not platform.window.MM.UME:
        __import__(__name__).__file__ = main
        msg  = "Ready to start ! Please click/touch page"
        platform.window.infobox.innerText = msg
        
        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    __import__(__name__).__file__ = main

    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

    <!-- Настройки Pygbag -->
    <script type="application/javascript">
        config = {
            xtermjs : "0" ,
            _sdl2 : "canvas",
            user_canvas : 0,
            user_canvas_managed : 0,
            gui_divider : 0,
            ume_block : 0, /* Отключаем блокировку клика */
            can_close : 0,
            archive : "sashs",
            gui_debug : 0,
            cdn : "https://pygame-web.github.io/cdn/0.9.3/",
            autorun : 0,
            PYBUILD : "3.12",
            fb_ar   :  1.77,
            fb_width : "1280",
            fb_height : "720"
        }

        async function custom_onload(debug_hidden) {
            const hideEl = (id) => { const el = document.getElementById(id); if(el) el.style.display = 'none'; };
            hideEl('pyconsole'); hideEl('system'); hideEl('transfer'); hideEl('info'); hideEl('box'); hideEl('crt');
        }

        let lastProgress = 0;
        setInterval(() => {
            const progressBar = document.getElementById('load-progress');
            const statusText = document.getElementById('load-status');
            const loadingScreen = document.getElementById('loading-screen');
            
            if (window.python && window.python.config && window.python.config.loaded) {
                progressBar.style.width = '100%';
                statusText.innerText = 'Starting game...';
                setTimeout(() => {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => loadingScreen.style.display = 'none', 500);
                }, 500);
            } else if (lastProgress < 90) {
                lastProgress += Math.random() * 5;
                progressBar.style.width = lastProgress + '%';
                if (lastProgress > 30) statusText.innerText = 'Downloading assets...';
                if (lastProgress > 60) statusText.innerText = 'Compiling WebAssembly...';
            }
        }, 500);
    </script>
